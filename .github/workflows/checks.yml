name: PHP checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l AWTRIXNG/module.php
      - run: php -l AWTRIXNGDiscovery/module.php
      - run: php -n tests/module_test.php
